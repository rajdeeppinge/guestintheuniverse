<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Guest in the Universe{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block description %}A blog exploring the vastness of our universe through technology, philosophy, and digital experiences.{% endblock %}">
    <meta name="keywords" content="universe, technology, philosophy, digital experiences, science, blog">
    <meta name="author" content="Guest in the Universe">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Guest in the Universe{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A blog exploring the vastness of our universe through technology, philosophy, and digital experiences.{% endblock %}">
    <meta property="og:url" content="{{ request.url }}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{% block twitter_title %}Guest in the Universe{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}A blog exploring the vastness of our universe through technology, philosophy, and digital experiences.{% endblock %}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.url }}">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/mobile.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'partials/header.html' %}
    
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    {% include 'partials/footer.html' %}

    <!-- JavaScript Files -->
    <script src="{{ url_for('static', filename='scripts/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/mobile.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>
</html>
