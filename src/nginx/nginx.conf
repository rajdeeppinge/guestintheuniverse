server {
    listen 80;
    server_name localhost;
    
    # Main content location
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Simple test page
    location /test {
        return 200 "<h1>Guest in the Universe is live!</h1><p>Let's explore this vast universe.</p>";
        add_header Content-Type text/html;
    }

    # Object Storage proxy for images (validation with mock values)
    location /images {
        # Mock rewrite for validation - this won't actually work but tests the pattern
        rewrite ^/images/(.*)$ /n/mock_namespace/b/mock_bucket/o/images/$1 break;
        proxy_pass https://mock_namespace.objectstorage.mock_region.oci.customer-oci.com;
        proxy_set_header Host mock_namespace.objectstorage.mock_region.oci.customer-oci.com;
    }
}
