services:
  app:
    build:
      context: ./app
      dockerfile: app.Dockerfile
    container_name: guestintheuniverse_app_local
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
      - ../posts:/posts
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
