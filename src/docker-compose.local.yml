services:
  app:
    build:
      context: ./app
      dockerfile: app.Dockerfile
    container_name: guestintheuniverse_app_local
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
      - ../posts:/posts
      - ../images:/images
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1

  nginx:
    build:
      context: ./nginx
      dockerfile: nginx.Dockerfile
    container_name: guestintheuniverse_nginx_local
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/tmp/ssl:/etc/ssl/certs:ro
      - ../images:/images:ro

networks:
  default:
    name: guestintheuniverse_network_local
