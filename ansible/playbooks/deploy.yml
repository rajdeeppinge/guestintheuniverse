---
- name: Deploy web app
  hosts: webservers
  become: yes
  vars_files:
    - ../vars.yml
  vars:
    app_image_tag: "{{ app_version | default(lookup('file', '../../APP_VERSION')) }}"
    nginx_image_tag: "{{ app_version | default(lookup('file', '../../APP_VERSION')) }}"
  
  roles:
    - docker
    - users
    - firewall
    - app
    - nginx
    - deploy
