---
- name: Upload posts
  hosts: webservers
  become: yes
  vars_files:
    - ../vars.yml
  
  tasks:
    - name: Create posts directory
      ansible.builtin.file:
        path: "{{ app_dir }}/posts"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'

    - name: Sync posts to server
      ansible.builtin.synchronize:
        src: "../../posts/"
        dest: "{{ app_dir }}/posts/"
        delete: no
        recursive: yes
        owner: no
        group: no
        perms: no
