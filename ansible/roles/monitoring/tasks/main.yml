---
- name: Install required dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'

- name: Add Grafana repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana Alloy (latest version)
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: "{{ alloy_config_path | dirname }}"
    state: directory
    mode: '0755'

- name: Create Alloy data directory
  ansible.builtin.file:
    path: "{{ alloy_data_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: alloy-config.alloy
    dest: "{{ alloy_config_path }}"
    mode: '0644'
  notify: restart alloy

- name: Start and enable Alloy service
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true

- name: Verify Alloy is running
  ansible.builtin.systemd:
    name: alloy
  register: alloy_status

- name: Check Alloy service status
  ansible.builtin.command:
    cmd: systemctl status alloy
  register: service_status
  changed_when: false
  ignore_errors: true

- name: Display Alloy status
  ansible.builtin.debug:
    msg: "{{ service_status.stdout_lines }}"
