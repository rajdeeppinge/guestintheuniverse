---
- name: Create production docker-compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Pull app image
  ansible.builtin.command:
    cmd: docker pull {{ app_image_name }}:{{ app_image_tag }}
  register: app_pull_result
  environment:
    REGISTRY: "{{ container_registry }}"
    IMAGE_NAME: "{{ repo_account }}/{{ repo_name }}"

- name: Pull nginx image
  ansible.builtin.command:
    cmd: docker pull {{ nginx_image_name }}:{{ nginx_image_tag }}
  register: nginx_pull_result
  environment:
    REGISTRY: "{{ container_registry }}"
    IMAGE_NAME: "{{ repo_account }}/{{ repo_name }}"

- name: Show pull results
  ansible.builtin.debug:
    msg: |
      App image pull: {{ app_pull_result.stdout }}
      Nginx image pull: {{ nginx_pull_result.stdout }}

- name: Deploy application with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"
  environment:
    REGISTRY: "{{ container_registry }}"
    IMAGE_NAME: "{{ repo_account }}/{{ repo_name }}"
    VERSION: "{{ app_image_tag }}"
    APP_NAME: "{{ app_name }}"
    HTTP_PORT: "{{ http_port }}"
    HTTPS_PORT: "{{ https_port }}"
    APP_PORT: "{{ app_port }}"
    SSL_CERT_PATH: "{{ ssl_cert_path }}"
  register: deployment_result

- name: Wait for containers to be ready
  ansible.builtin.pause:
    seconds: '{{ deployment_wait_time | default(30) }}'

- name: Verify deployment
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ app_dir }}"
  register: deployment_status

- name: Show deployment status
  ansible.builtin.debug:
    msg: "Deployment status: {{ deployment_status.stdout_lines }}"
