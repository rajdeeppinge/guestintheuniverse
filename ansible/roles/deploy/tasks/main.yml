---
- name: Create production docker-compose file
  ansible.builtin.copy:
    src: "../../../../src/docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Create posts directory
  ansible.builtin.file:
    path: "{{ app_dir }}/posts"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Create images directory
  ansible.builtin.file:
    path: "{{ app_dir }}/images"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy posts to server
  ansible.builtin.copy:
    src: "../../../../posts/"
    dest: "{{ app_dir }}/posts/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Copy images to server
  ansible.builtin.copy:
    src: "../../../../images/"
    dest: "{{ app_dir }}/images/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Login to GitHub Container Registry
  ansible.builtin.command:
    cmd: docker login ghcr.io -u {{ github_username }} -p {{ github_token }}
  no_log: true

- name: Pull app image
  ansible.builtin.command:
    cmd: docker pull {{ app_image_name }}:{{ app_image_tag }}
  register: app_pull_result

- name: Pull nginx image
  ansible.builtin.command:
    cmd: docker pull {{ nginx_image_name }}:{{ nginx_image_tag }}
  register: nginx_pull_result

- name: Show pull results
  ansible.builtin.debug:
    msg: |
      App image pull: {{ app_pull_result.stdout }}
      Nginx image pull: {{ nginx_pull_result.stdout }}

- name: Deploy application with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"
  environment:
    APP_IMAGE_NAME: "{{ app_image_name }}"
    APP_IMAGE_TAG: "{{ app_image_tag }}"
    NGINX_IMAGE_NAME: "{{ nginx_image_name }}"
    NGINX_IMAGE_TAG: "{{ nginx_image_tag }}"
    APP_NAME: "{{ app_name }}"
    APP_PORT: "{{ app_port }}"
    HTTP_PORT: "{{ http_port }}"
    HTTPS_PORT: "{{ https_port }}"
    SSL_CERT_PATH: "{{ ssl_cert_path }}"
  register: deployment_result

- name: Wait for containers to be ready
  ansible.builtin.pause:
    seconds: '{{ deployment_wait_time | default(30) }}'

- name: Verify deployment
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ app_dir }}"
  environment:
    APP_IMAGE_NAME: "{{ app_image_name }}"
    APP_IMAGE_TAG: "{{ app_image_tag }}"
    NGINX_IMAGE_NAME: "{{ nginx_image_name }}"
    NGINX_IMAGE_TAG: "{{ nginx_image_tag }}"
    APP_NAME: "{{ app_name }}"
    APP_PORT: "{{ app_port }}"
    HTTP_PORT: "{{ http_port }}"
    HTTPS_PORT: "{{ https_port }}"
    SSL_CERT_PATH: "{{ ssl_cert_path }}"
  register: deployment_status

- name: Show deployment status
  ansible.builtin.debug:
    msg: "Deployment status: {{ deployment_status.stdout_lines }}"
