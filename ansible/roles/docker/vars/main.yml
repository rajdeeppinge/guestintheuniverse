---
# Docker installation variables
docker_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

docker_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"

docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
