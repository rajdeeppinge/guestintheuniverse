# GitHub Secrets Configuration Template
# 
# This file contains GitHub Secrets configuration for CI/CD workflows.
# Add these in: GitHub Repository > Settings > Secrets and variables > Actions

## Host Configuration
```
HOST=your-server.domain.com
USER=your-ssh-username
SSH_KEY=-----BEGIN OPENSSH PRIVATE KEY-----
[Your complete private key content here]
-----END OPENSSH PRIVATE KEY-----
```

## Application Configuration
```
APP_NAME=your-app-name
APP_DIR=/path/to/your-app-name
APP_PORT=your-app-port
DOCKER_NETWORK=your-docker-network
```

## Network Configuration
```
DOMAIN_NAME=your-domain.com
HTTP_PORT=your-http-port
HTTPS_PORT=your-https-port
SSL_CERT_PATH=/path/to/your/certs/on/server
```

## OCI Object Storage Configuration
```
OCI_NAMESPACE=your-oci-namespace
OCI_BUCKET=your-oci-bucket
OCI_REGION=your-oci-region
```

## Security Warning
This file contains example values only. Never commit actual secrets to the repository.

