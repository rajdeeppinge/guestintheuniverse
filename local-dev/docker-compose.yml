version: "3.8"

services:
  app:
    build:
      context: ./app
      dockerfile: app.Dockerfile
    container_name: guestintheuniverse_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1

  nginx:
    build:
      context: ./nginx
      dockerfile: nginx.Dockerfile
    container_name: guestintheuniverse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

networks:
  default:
    name: guestintheuniverse_network
