name: Infrastructure Configuration

on:
  push:
    branches: [ master ]
    paths:
      - 'ansible/roles/docker/**'
      - 'ansible/roles/users/**'
      - 'ansible/roles/firewall/**'
      - 'ansible/roles/monitoring/**'
      - 'ansible/roles/system-update/**'
      - 'ansible/playbooks/infrastructure.yml'
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible

    - name: Install Ansible collections
      run: |
        ansible-galaxy collection install community.docker

    - name: Create ansible.cfg
      run: |
        cat > ansible.cfg << EOF
        [defaults]
        host_key_checking = False
        inventory = ./ansible/inventory
        retry_files_enabled = False
        roles_path = ./ansible/roles
        EOF

    - name: Create inventory file
      run: |
        cat > ansible/inventory/production.yml << EOF
        ---
        all:
          children:
            webservers:
              hosts:
                ${{ secrets.HOST }}:
                  ansible_user: ${{ secrets.USER }}
                  ansible_ssh_private_key_file: /tmp/ssh_key
                  ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        EOF

    - name: Create SSH key file
      run: |
        echo '${{ secrets.SSH_KEY }}' > /tmp/ssh_key
        chmod 600 /tmp/ssh_key

    - name: Create vars file from template
      run: |
        cat > ansible/vars.yml << EOF
        ---
        # Global connection variables
        host: "${{ secrets.HOST }}"
        user: "${{ secrets.USER }}"
        ssh_key: "/tmp/ssh_key"

        # Global application variables
        app_name: "${{ secrets.APP_NAME }}"
        app_dir: "${{ secrets.APP_DIR }}"
        app_port: ${{ secrets.APP_PORT }}
        docker_network: "${{ secrets.DOCKER_NETWORK }}"

        # Global network variables
        domain_name: "${{ secrets.DOMAIN_NAME }}"
        http_port: ${{ secrets.HTTP_PORT }}
        https_port: ${{ secrets.HTTPS_PORT }}

        # SSL certificate path on server
        ssl_cert_path: "${{ secrets.SSL_CERT_PATH }}"

        # OCI Object Storage variables
        oci_namespace: "${{ secrets.OCI_NAMESPACE }}"
        oci_bucket: "${{ secrets.OCI_BUCKET }}"
        oci_region: "${{ secrets.OCI_REGION }}"
        EOF

    - name: Run Ansible infrastructure configuration
      run: |
        ansible-playbook -i ansible/inventory/production.yml ansible/playbooks/infrastructure.yml
