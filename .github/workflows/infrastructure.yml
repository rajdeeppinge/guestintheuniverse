name: Infrastructure Configuration

on:
  push:
    branches: [ master ]
    paths:
      - 'ansible/roles/docker/**'
      - 'ansible/roles/users/**'
      - 'ansible/roles/firewall/**'
      - 'ansible/roles/monitoring/**'
      - 'ansible/roles/system-update/**'
      - 'ansible/playbooks/infrastructure.yml'
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9 AM UTC
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ansible
      uses: ./.github/actions/ansible-setup
      with:
        vars_content: |
          ---
          # Global connection variables
          host: "${{ secrets.HOST }}"
          user: "${{ secrets.USER }}"
          ssh_key: "/tmp/ssh_key"

          # Global application variables
          app_dir: "${{ secrets.APP_DIR }}"

          # Global network variables
          http_port: ${{ secrets.HTTP_PORT }}
          https_port: ${{ secrets.HTTPS_PORT }}
        host: "${{ secrets.HOST }}"
        user: "${{ secrets.USER }}"
        ssh_key: "${{ secrets.SSH_KEY }}"

    - name: Run Ansible infrastructure configuration
      run: |
        ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/infrastructure.yml
