name: Reusable Ansible Setup

on:
  workflow_call:
    inputs:
      vars_content:
        description: 'Ansible vars.yml content'
        required: true
        type: string
      install_collections:
        description: 'Whether to install Ansible collections'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible

    - name: Install Ansible collections
      if: inputs.install_collections == true
      run: |
        ansible-galaxy collection install community.docker

    - name: Create ansible.cfg
      run: |
        cat > ansible.cfg << EOF
        [defaults]
        host_key_checking = False
        inventory = ./ansible/inventory
        retry_files_enabled = False
        roles_path = ./ansible/roles
        EOF

    - name: Create inventory file
      run: |
        cat > ansible/inventory/hosts.yml << EOF
        ---
        all:
          children:
            webservers:
              hosts:
                ${{ secrets.HOST }}:
                  ansible_user: ${{ secrets.USER }}
                  ansible_ssh_private_key_file: /tmp/ssh_key
                  ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        EOF

    - name: Create SSH key file
      run: |
        echo '${{ secrets.SSH_KEY }}' > /tmp/ssh_key
        chmod 600 /tmp/ssh_key

    - name: Create vars file
      run: |
        cat > ansible/vars.yml << EOF
        ${{ inputs.vars_content }}
        EOF
