name: App Deployment

on:
  push:
    branches: [ master, feature/ghcr-image-retention ]
    tags:
      - 'v*.*.*'
    paths:
      - 'src/**'
      - 'ansible/playbooks/app-deploy.yml'
      - 'ansible/roles/app/**'
      - 'ansible/roles/nginx/**'
      - 'ansible/roles/deploy/**'
      - 'APP_VERSION'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract latest app version
      id: app_version
      run: |
        VERSION=$(cat APP_VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Check version consistency
      id: version_check
      run: |
        APP_VERSION=$(cat APP_VERSION)
        
        # Extract latest version from RELEASE_NOTES.md
        LATEST_VERSION=$(grep -m1 "### v" RELEASE_NOTES.md | sed 's/### \(v[0-9.]*\(-[^ ]*\)\?\).*/\1/')
        
        echo "APP_VERSION: $APP_VERSION"
        echo "Latest in RELEASE_NOTES.md: $LATEST_VERSION"
        
        if [ "$APP_VERSION" != "$LATEST_VERSION" ]; then
          echo "Version mismatch detected!"
          echo "APP_VERSION: $APP_VERSION"
          echo "RELEASE_NOTES.md: $LATEST_VERSION"
          echo "Please update RELEASE_NOTES.md to match APP_VERSION"
          exit 1
        fi
        
        echo "Versions are consistent"
        echo "consistent=true" >> $GITHUB_OUTPUT
      shell: bash

    - name: Check if image tag already exists
      id: check_tag
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}"
        echo "Checking if image tag exists: $IMAGE_TAG"
        
        # Check if tag exists using GitHub Container Registry API
        if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
           "https://api.github.com/repos/${{ github.repository }}/packages/container/guestintheuniverse/versions" | \
           grep -q "${{ steps.app_version.outputs.version }}"; then
          echo "Image tag already exists!" 
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Please update APP_VERSION and RELEASE_NOTES.md before deploying"
          exit 1
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Check if app code changed
      id: app_code_changed
      run: |
        if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^src/'; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "App code changed, will build images"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "App code not changed, will skip build but run cleanup"
        fi
      shell: bash

    - name: Build app image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false' && steps.app_code_changed.outputs.changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./src/app
        file: ./src/app/app.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe
          org.opencontainers.image.description=Blog and web application
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Build nginx image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false' && steps.app_code_changed.outputs.changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./src/nginx
        file: ./src/nginx/nginx.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe Nginx
          org.opencontainers.image.description=Nginx reverse proxy for Guest in the Universe
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Validate images
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false' && steps.app_code_changed.outputs.changed == 'true'
      run: |
        echo "Starting validation using docker-compose..."
        
        # Navigate to compose file location
        cd "${{ github.workspace }}/src"
        
        # Create empty mount directories for validation
        echo "Creating empty mount directories for validation..."
        mkdir -p posts
        
        # Function to cleanup and exit
        cleanup_and_exit() {
          echo "Cleaning up validation environment..."
          docker compose -f docker-compose.yml down -v --remove-orphans
          exit $1
        }
        
        # Check if curl is available
        if ! command -v curl &> /dev/null; then
          echo "Error: curl is not installed on this system"
          cleanup_and_exit 1
        fi
        
        # Check if docker compose is available
        if ! docker compose version &> /dev/null; then
          echo "Error: docker compose is not available on this system"
          echo "Available docker commands:"
          docker --version
          echo "Docker compose commands:"
          docker compose version 2>/dev/null || echo "  docker compose: not found"
          docker-compose --version 2>/dev/null || echo "  docker-compose: not found"
          cleanup_and_exit 1
        fi
        
        # Start services
        echo "Starting validation services..."
        docker compose -f docker-compose.yml up -d
        
        # Wait for services to be ready
        echo "Waiting for services to start..."
        sleep 15
        
        # Test app health endpoint through nginx
        echo "Testing app health endpoint through nginx..."
        if ! curl -f http://localhost:8080/api/v1/health; then
          echo "App health check failed through nginx!"
          docker compose -f docker-compose.yml logs app
          docker compose -f docker-compose.yml logs nginx
          cleanup_and_exit 1
        else
          echo "App health check passed through nginx"
        fi
        
        # Test app root endpoint通过 nginx
        echo "Testing app root endpoint through nginx..."
        ROOT_CHECK=$(curl -f -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo "000")
        
        if [ "$ROOT_CHECK" != "200" ]; then
          echo "App root endpoint check failed through nginx! HTTP code: $ROOT_CHECK"
          docker compose -f docker-compose.yml logs app
          cleanup_and_exit 1
        else
          echo "App root endpoint check passed through nginx! HTTP code: $ROOT_CHECK"
        fi
        
        # Test nginx health endpoint
        echo "Testing nginx health endpoint..."
        NGINX_HEALTH=$(curl -f -s http://localhost:8080/health || echo "FAILED")
        if [ "$NGINX_HEALTH" = "FAILED" ]; then
          echo "Nginx health endpoint failed!"
          docker compose -f docker-compose.yml logs nginx
          cleanup_and_exit 1
        else
          echo "Nginx health endpoint passed!"
        fi
        
        # Test images endpoint proxy configuration
        echo "Testing images endpoint proxy configuration..."
        IMAGES_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/images/test.jpg || echo "000")
        if [ "$IMAGES_CHECK" = "404" ]; then
          echo "Images endpoint proxy configuration working (expected 404 for non-existent image)"
        else
          echo "Images endpoint proxy configuration failed! HTTP code: $IMAGES_CHECK"
          docker compose -f docker-compose.yml logs nginx
          cleanup_and_exit 1
        fi
        
        # Cleanup
        echo "Validation completed successfully!"
        cleanup_and_exit 0
      shell: bash
      env:
        APP_IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
        APP_IMAGE_TAG: ${{ steps.app_version.outputs.version }}
        NGINX_IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx
        NGINX_IMAGE_TAG: ${{ steps.app_version.outputs.version }}
        APP_NAME: guestintheuniverse
        APP_PORT: "5000"
        HTTP_PORT: "8080"
        HTTPS_PORT: "8443"
        SSL_CERT_PATH: "/tmp/ssl-certs"

    - name: Push images
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false' && steps.app_code_changed.outputs.changed == 'true'
      run: |
        echo "Pushing images to registry..."
        
        # Push app image
        echo "Pushing app image..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        
        # Push nginx image
        echo "Pushing nginx image..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        
        echo "Images pushed successfully!"
      shell: bash

    - name: Delete old image versions
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      run: |
        echo "Cleaning up old image versions..."
        
        # Get current version (ensure it has 'v' prefix)
        CURRENT_VERSION="${{ steps.app_version.outputs.version }}"
        if [[ ! "$CURRENT_VERSION" =~ ^v ]]; then
          CURRENT_VERSION="v$CURRENT_VERSION"
        fi
        echo "Current version: $CURRENT_VERSION"
        
        # Function to cleanup a specific package
        cleanup_package() {
          local PACKAGE_NAME=$1
          echo "Cleaning up package: $PACKAGE_NAME"
          
          # URL encode the package name for API
          ENCODED_PACKAGE_NAME=$(echo "$PACKAGE_NAME" | sed 's/\//%2F/g')
          
          # Get all versions from the package with pagination
          ALL_VERSIONS="[]"
          PAGE=1
          while true; do
            PAGE_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE_NAME/versions?per_page=100&page=$PAGE")
          
          # Check if package exists
            if echo "$PAGE_RESPONSE" | grep -q "Not Found"; then
            echo "Package $PACKAGE_NAME not found yet, skipping"
            return
          fi
          
            # Check if we got an empty array (no more pages)
            if [ "$(echo "$PAGE_RESPONSE" | jq 'length')" = "0" ]; then
              break
            fi
            
            # Merge this page with all versions
            ALL_VERSIONS=$(echo "$ALL_VERSIONS" "$PAGE_RESPONSE" | jq -s '.[0] + .[1]')
            
            PAGE=$((PAGE + 1))
          done
          
          echo "Total versions retrieved: $(echo "$ALL_VERSIONS" | jq 'length')"
          
          # Extract both tagged and untagged versions
          TAGGED_VERSIONS=$(echo "$ALL_VERSIONS" | jq -r '.[].metadata.container.tags[]?' 2>/dev/null | sort -V || echo "")
          
          # Untagged versions have empty tags array
          UNTAGGED_COUNT=$(echo "$ALL_VERSIONS" | jq '[.[] | select(.metadata.container.tags == null or .metadata.container.tags == [])] | length')
          
          echo "Tagged versions: $TAGGED_VERSIONS"
          echo "Untagged versions count: $UNTAGGED_COUNT"
          
          VERSIONS="$TAGGED_VERSIONS"
          
          if [ -z "$VERSIONS" ] && [ "$UNTAGGED_COUNT" = "0" ]; then
            echo "No versions found for $PACKAGE_NAME, skipping"
            return
          fi
          
          # Separate prod and dev versions (dev versions must have v prefix)
          PROD_VERSIONS=$(echo "$VERSIONS" | grep -v -- '-dev' || true)
          DEV_VERSIONS=$(echo "$VERSIONS" | grep '^v.*-dev' || true)
          
          echo "Prod versions: $PROD_VERSIONS"
          echo "Dev versions: $DEV_VERSIONS"
          
          # Delete all untagged versions (they take up space without being useful)
          if [ "$UNTAGGED_COUNT" -gt 0 ]; then
            echo "Deleting $UNTAGGED_COUNT untagged versions"
            UNTAGGED_IDS=$(echo "$ALL_VERSIONS" | jq -r '.[] | select(.metadata.container.tags == null or .metadata.container.tags == []) | .id')
            for untagged_id in $UNTAGGED_IDS; do
              echo "Deleting untagged version ID: $untagged_id"
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE_NAME/versions/$untagged_id"
              echo "Deleted untagged version ID: $untagged_id"
            done
          fi
          
          # Keep only last 3 prod versions
          PROD_TO_KEEP=$(echo "$PROD_VERSIONS" | tail -n 3)
          PROD_TO_DELETE=$(echo "$PROD_VERSIONS" | grep -v -F "$PROD_TO_KEEP" || true)
          
          echo "Prod versions to keep: $PROD_TO_KEEP"
          echo "Prod versions to delete: $PROD_TO_DELETE"
          
          # Delete old prod versions
          for version in $PROD_TO_DELETE; do
            echo "Deleting prod version: $version from $PACKAGE_NAME"
            VERSION_ID=$(echo "$ALL_VERSIONS" | jq -r --arg tag "$version" '.[] | select(.metadata.container.tags[]? == $tag) | .id')
            
            if [ -n "$VERSION_ID" ]; then
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE_NAME/versions/$VERSION_ID"
              echo "Deleted version $version (ID: $VERSION_ID) from $PACKAGE_NAME"
            fi
          done
          
          # Extract current major.minor from current version (remove 'v' prefix and dev suffix)
          CURRENT_VERSION_NO_V=$(echo "$CURRENT_VERSION" | sed 's/^v//')
          CURRENT_BASE=$(echo "$CURRENT_VERSION_NO_V" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CURRENT_MAJOR_MINOR=$(echo "$CURRENT_BASE" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          echo "Current base version: $CURRENT_BASE"
          echo "Current major.minor: $CURRENT_MAJOR_MINOR"
          
          # Delete dev versions for older prod releases (only handle v*.*.*-dev* format)
          for dev_version in $DEV_VERSIONS; do
            # Extract base version from dev version (e.g., v0.3.0-dev1 -> 0.3.0)
            DEV_BASE=$(echo "$dev_version" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
            DEV_MAJOR_MINOR=$(echo "$DEV_BASE" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
            
            echo "Dev version: $dev_version, Base: $DEV_BASE, Major.minor: $DEV_MAJOR_MINOR"
            
            # Compare versions - delete dev versions for older prod releases
            if [ "$DEV_MAJOR_MINOR" != "$CURRENT_MAJOR_MINOR" ]; then
              echo "Deleting dev version for older release: $dev_version from $PACKAGE_NAME"
              VERSION_ID=$(echo "$ALL_VERSIONS" | jq -r --arg tag "$dev_version" '.[] | select(.metadata.container.tags[]? == $tag) | .id')
              
              if [ -n "$VERSION_ID" ]; then
                curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$ENCODED_PACKAGE_NAME/versions/$VERSION_ID"
                echo "Deleted dev version $dev_version (ID: $VERSION_ID) from $PACKAGE_NAME"
              fi
            else
              echo "Keeping dev version for current release: $dev_version in $PACKAGE_NAME"
            fi
          done
        }
        
        # Cleanup both app and nginx packages
        cleanup_package "guestintheuniverse/app"
        cleanup_package "guestintheuniverse/nginx"
        
        echo "Cleanup completed!"
      shell: bash

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract latest app version
      id: app_version
      run: |
        VERSION=$(cat APP_VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Ansible
      uses: ./.github/actions/ansible-setup
      with:
        vars_content: |
          ---
          # Global connection variables
          host: "${{ secrets.HOST }}"
          user: "${{ secrets.USER }}"
          ssh_key: "/tmp/ssh_key"

          # Global application variables
          app_name: "${{ secrets.APP_NAME }}"
          app_dir: "${{ secrets.APP_DIR }}"
          app_port: ${{ secrets.APP_PORT }}
          docker_network: "${{ secrets.DOCKER_NETWORK }}"
          app_user: "${{ secrets.APP_USER }}"
          app_group: "${{ secrets.APP_GROUP }}"

          # Global network variables
          domain_name: "${{ secrets.DOMAIN_NAME }}"
          http_port: ${{ secrets.HTTP_PORT }}
          https_port: ${{ secrets.HTTPS_PORT }}

          # SSL certificate path on server
          ssl_cert_path: "${{ secrets.SSL_CERT_PATH }}"

          # OCI Object Storage variables
          oci_namespace: "${{ secrets.OCI_NAMESPACE }}"
          oci_bucket: "${{ secrets.OCI_BUCKET }}"
          oci_region: "${{ secrets.OCI_REGION }}"

          # GitHub Container Registry variables
          container_registry: "${{ env.REGISTRY }}"
          app_image_name: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app"
          nginx_image_name: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx"
          app_version: "${{ steps.app_version.outputs.version }}"
          nginx_version: "${{ steps.app_version.outputs.version }}"

          # GitHub Container Registry authentication
          github_username: "${{ github.actor }}"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
        host: "${{ secrets.HOST }}"
        user: "${{ secrets.USER }}"
        ssh_key: "${{ secrets.SSH_KEY }}"

    - name: Run Ansible app deployment
      run: |
        ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/app-deploy.yml
