name: Build and Deploy

on:
  push:
    branches: [ feature/github-actions ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract latest app version
      id: app_version
      run: |
        VERSION=$(cat APP_VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Check version consistency
      id: version_check
      run: |
        APP_VERSION=$(cat APP_VERSION)
        
        # Extract latest version from RELEASE_NOTES.md
        LATEST_VERSION=$(grep -m1 "### v" RELEASE_NOTES.md | sed 's/### \(v[0-9.]*-[^ ]*\).*/\1/')
        
        echo "APP_VERSION: $APP_VERSION"
        echo "Latest in RELEASE_NOTES.md: $LATEST_VERSION"
        
        if [ "$APP_VERSION" != "$LATEST_VERSION" ]; then
          echo "Version mismatch detected!"
          echo "APP_VERSION: $APP_VERSION"
          echo "RELEASE_NOTES.md: $LATEST_VERSION"
          echo "Please update RELEASE_NOTES.md to match APP_VERSION"
          exit 1
        fi
        
        echo "Versions are consistent"
        echo "consistent=true" >> $GITHUB_OUTPUT
      shell: bash

    - name: Check if image tag already exists
      id: check_tag
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}"
        echo "Checking if image tag exists: $IMAGE_TAG"
        
        # Check if tag exists using GitHub Container Registry API
        if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
           "https://api.github.com/repos/${{ github.repository }}/packages/container/guestintheuniverse/versions" | \
           grep -q "${{ steps.app_version.outputs.version }}"; then
          echo "Image tag already exists!"
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Please update APP_VERSION and RELEASE_NOTES.md before deploying"
          exit 1
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build app image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      uses: docker/build-push-action@v5
      with:
        context: ./src/app
        file: ./src/app/app.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe
          org.opencontainers.image.description=Blog and web application
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Build nginx image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      uses: docker/build-push-action@v5
      with:
        context: ./src/nginx
        file: ./src/nginx/nginx.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe Nginx
          org.opencontainers.image.description=Nginx reverse proxy for Guest in the Universe
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Validate images
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      run: |
        echo "Starting combined validation of container images..."
        
        # Create a temporary network for validation
        NETWORK_NAME="validation_network_${{ steps.app_version.outputs.version }}"
        docker network create $NETWORK_NAME
        
        # Function to cleanup and exit
        cleanup_and_exit() {
          echo "Cleaning up containers and network..."
          if [ ! -z "$APP_CONTAINER_NAME" ]; then
            docker logs $APP_CONTAINER_NAME 2>&1 | tail -20
            docker stop $APP_CONTAINER_NAME
            docker rm $APP_CONTAINER_NAME
          fi
          if [ ! -z "$NGINX_CONTAINER_NAME" ]; then
            docker logs $NGINX_CONTAINER_NAME 2>&1 | tail -20
            docker stop $NGINX_CONTAINER_NAME
            docker rm $NGINX_CONTAINER_NAME
          fi
          docker network rm $NETWORK_NAME || true
          exit $1
        }
        
        # Start app container for validation
        echo "Starting app container for validation..."
        APP_CONTAINER_NAME="app_validation_${{ steps.app_version.outputs.version }}"
        docker run -d --name $APP_CONTAINER_NAME --network $NETWORK_NAME \
          --expose 5000 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        
        # Wait for app to start
        echo "Waiting for app to start..."
        sleep 10
        
        # Test app health endpoint
        echo "Testing app health endpoint..."
        HEALTH_CHECK=$(docker exec $APP_CONTAINER_NAME curl -f -s http://localhost:5000/health || echo "FAILED")
        
        if [ "$HEALTH_CHECK" = "FAILED" ]; then
          echo "App health check failed!"
          cleanup_and_exit 1
        else
          echo "App health check passed: $HEALTH_CHECK"
        fi
        
        # Test app root endpoint
        echo "Testing app root endpoint..."
        ROOT_CHECK=$(docker exec $APP_CONTAINER_NAME curl -f -s -o /dev/null -w "%{http_code}" http://localhost:5000/ || echo "000")
        
        if [ "$ROOT_CHECK" != "200" ]; then
          echo "App root endpoint check failed! HTTP code: $ROOT_CHECK"
          cleanup_and_exit 1
        else
          echo "App root endpoint check passed! HTTP code: $ROOT_CHECK"
        fi
        
        # Test nginx configuration with app container
        echo "Testing nginx configuration with app upstream..."
        VALIDATION_OUTPUT=$(docker run --rm --network $NETWORK_NAME \
          -v "${{ github.workspace }}/src/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }} \
          nginx -t 2>&1)
        
        VALIDATION_EXIT_CODE=$?
        
        if [ $VALIDATION_EXIT_CODE -eq 0 ]; then
          echo "Nginx configuration validation passed!"
          echo "$VALIDATION_OUTPUT" | grep -E "(successful|syntax is ok)"
        else
          echo "Nginx configuration validation failed!"
          echo "$VALIDATION_OUTPUT"
          cleanup_and_exit 1
        fi
        
        # Test nginx can actually proxy to app
        echo "Testing nginx proxy functionality..."
        NGINX_CONTAINER_NAME="nginx_test_${{ steps.app_version.outputs.version }}"
        docker run -d --name $NGINX_CONTAINER_NAME --network $NETWORK_NAME \
          -p 8080:80 \
          -v "${{ github.workspace }}/src/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        
        # Wait for nginx to start
        sleep 5
        
        # Test nginx health endpoint
        NGINX_HEALTH=$(curl -f -s http://localhost:8080/health || echo "FAILED")
        if [ "$NGINX_HEALTH" = "FAILED" ]; then
          echo "Nginx health endpoint failed!"
          cleanup_and_exit 1
        else
          echo "Nginx health endpoint passed!"
        fi
        
        # Cleanup nginx test container
        docker stop $NGINX_CONTAINER_NAME
        docker rm $NGINX_CONTAINER_NAME
        
        # Cleanup app container and network
        docker stop $APP_CONTAINER_NAME
        docker rm $APP_CONTAINER_NAME
        docker network rm $NETWORK_NAME
        
        echo "Combined validation completed successfully!"
      shell: bash

    - name: Push images
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      run: |
        echo "Pushing images to registry..."
        
        # Push app image
        echo "Pushing app image..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        
        # Push nginx image
        echo "Pushing nginx image..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        
        echo "Images pushed successfully!"
      shell: bash
