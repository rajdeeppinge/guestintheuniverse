name: Build and Deploy

on:
  push:
    branches: [ feature/github-actions ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract latest app version
      id: app_version
      run: |
        VERSION=$(cat APP_VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Check version consistency
      id: version_check
      run: |
        APP_VERSION=$(cat APP_VERSION)
        
        # Extract latest version from RELEASE_NOTES.md
        LATEST_VERSION=$(grep -m1 "### v" RELEASE_NOTES.md | sed 's/### \(v[0-9.]*-[^ ]*\).*/\1/')
        
        echo "APP_VERSION: $APP_VERSION"
        echo "Latest in RELEASE_NOTES.md: $LATEST_VERSION"
        
        if [ "$APP_VERSION" != "$LATEST_VERSION" ]; then
          echo "Version mismatch detected!"
          echo "APP_VERSION: $APP_VERSION"
          echo "RELEASE_NOTES.md: $LATEST_VERSION"
          echo "Please update RELEASE_NOTES.md to match APP_VERSION"
          exit 1
        fi
        
        echo "Versions are consistent"
        echo "consistent=true" >> $GITHUB_OUTPUT
      shell: bash

    - name: Check if image tag already exists
      id: check_tag
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}"
        echo "Checking if image tag exists: $IMAGE_TAG"
        
        # Check if tag exists using GitHub Container Registry API
        if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
           "https://api.github.com/repos/${{ github.repository }}/packages/container/guestintheuniverse/versions" | \
           grep -q "${{ steps.app_version.outputs.version }}"; then
          echo "Image tag already exists!"
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Please update APP_VERSION and RELEASE_NOTES.md before deploying"
          exit 1
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build app image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      uses: docker/build-push-action@v5
      with:
        context: ./src/app
        file: ./src/app/app.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe
          org.opencontainers.image.description=Blog and web application
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Validate app image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      run: |
        echo "Starting app container for validation..."
        
        # Start app container in background
        CONTAINER_NAME="app_validation_${{ steps.app_version.outputs.version }}"
        docker run -d --name $CONTAINER_NAME -p 5000:5000 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
        
        # Function to cleanup and exit
        cleanup_and_exit() {
          echo "Cleaning up container..."
          docker logs $CONTAINER_NAME 2>&1 | tail -20  # Show last 20 lines of logs
          docker stop $CONTAINER_NAME
          docker rm $CONTAINER_NAME
          exit $1
        }
        
        # Wait for app to start
        echo "Waiting for app to start..."
        sleep 10
        
        # Test health endpoint
        echo "Testing health endpoint..."
        HEALTH_CHECK=$(curl -f -s http://localhost:5000/health || echo "FAILED")
        
        if [ "$HEALTH_CHECK" = "FAILED" ]; then
          echo "Health check failed!"
          cleanup_and_exit 1
        else
          echo "Health check passed: $HEALTH_CHECK"
        fi
        
        # Test root endpoint
        echo "Testing root endpoint..."
        ROOT_CHECK=$(curl -f -s -o /dev/null -w "%{http_code}" http://localhost:5000/ || echo "000")
        
        if [ "$ROOT_CHECK" != "200" ]; then
          echo "Root endpoint check failed! HTTP code: $ROOT_CHECK"
          cleanup_and_exit 1
        else
          echo "Root endpoint check passed! HTTP code: $ROOT_CHECK"
        fi
        
        # Cleanup on success
        docker stop $CONTAINER_NAME
        docker rm $CONTAINER_NAME
        echo "App validation completed successfully"
      shell: bash

    - name: Push app image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_tag.outputs.exists == 'false'
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ steps.app_version.outputs.version }}
      shell: bash

    - name: Check if nginx image tag already exists
      id: check_nginx_tag
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}"
        echo "Checking if nginx image tag exists: $IMAGE_TAG"
        
        # Check if tag exists using GitHub Container Registry API
        if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
           "https://api.github.com/repos/${{ github.repository }}/packages/container/guestintheuniverse/versions" | \
           grep -q "${{ steps.app_version.outputs.version }}"; then
          echo "Nginx image tag already exists!"
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Please update APP_VERSION and RELEASE_NOTES.md before deploying"
          exit 1
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build nginx image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_nginx_tag.outputs.exists == 'false'
      uses: docker/build-push-action@v5
      with:
        context: ./src/nginx
        file: ./src/nginx/nginx.Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Guest in the Universe Nginx
          org.opencontainers.image.description=Nginx reverse proxy for Guest in the Universe
          org.opencontainers.image.version=${{ steps.app_version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Validate Nginx configuration
      if: steps.version_check.outputs.consistent == 'true' && steps.check_nginx_tag.outputs.exists == 'false'
      run: |
        echo "Starting nginx configuration validation..."
        
        # Create a temporary network for validation
        NETWORK_NAME="nginx_validation_network_${{ steps.app_version.outputs.version }}"
        docker network create $NETWORK_NAME
        
        # Run Nginx configuration validation
        echo "Testing nginx configuration syntax..."
        VALIDATION_OUTPUT=$(docker run --rm --network $NETWORK_NAME \
          -v "${{ github.workspace }}/src/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }} \
          nginx -t 2>&1)
        
        VALIDATION_EXIT_CODE=$?
        
        if [ $VALIDATION_EXIT_CODE -eq 0 ]; then
          echo "Nginx configuration validation passed!"
          echo "$VALIDATION_OUTPUT" | grep -E "(successful|syntax is ok)"
        else
          echo "Nginx configuration validation failed!"
          echo "$VALIDATION_OUTPUT"
          docker network rm $NETWORK_NAME || true
          exit 1
        fi
        
        # Clean up the validation network
        docker network rm $NETWORK_NAME
        echo "Nginx validation completed successfully"
      shell: bash

    - name: Push nginx image
      if: steps.version_check.outputs.consistent == 'true' && steps.check_nginx_tag.outputs.exists == 'false'
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ steps.app_version.outputs.version }}
      shell: bash
