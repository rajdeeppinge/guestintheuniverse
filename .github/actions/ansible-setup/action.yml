name: 'Ansible Setup'
description: 'Setup Ansible with configuration files'
inputs:
  vars_content:
    description: 'Ansible vars.yml content'
    required: true
  install_collections:
    description: 'Whether to install Ansible collections'
    required: false
    default: 'true'
  host:
    description: 'Server hostname'
    required: true
  user:
    description: 'SSH user'
    required: true
  ssh_key:
    description: 'SSH private key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ansible
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ansible

    - name: Install Ansible collections
      if: inputs.install_collections == 'true'
      shell: bash
      run: |
        ansible-galaxy collection install community.docker

    - name: Create ansible.cfg
      shell: bash
      run: |
        cat > ansible.cfg << EOF
        [defaults]
        host_key_checking = False
        inventory = ./ansible/inventory
        retry_files_enabled = False
        roles_path = ./ansible/roles
        EOF

    - name: Create inventory file
      shell: bash
      run: |
        cat > ansible/inventory/hosts.yml << EOF
        ---
        all:
          children:
            webservers:
              hosts:
                ${{ inputs.host }}:
                  ansible_user: ${{ inputs.user }}
                  ansible_ssh_private_key_file: /tmp/ssh_key
                  ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        EOF

    - name: Create SSH key file
      shell: bash
      run: |
        echo '${{ inputs.ssh_key }}' > /tmp/ssh_key
        chmod 600 /tmp/ssh_key

    - name: Create vars file
      shell: bash
      run: |
        cat > ansible/vars.yml << EOF
        ${{ inputs.vars_content }}
        EOF
